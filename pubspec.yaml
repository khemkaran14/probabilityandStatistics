name: chance
description: "Chance – learn probability & statistics through animation."
publish_to: 'none'
version: 1.6.1+8

environment:
  sdk: ^3.5.0

dependencies:
  audioplayers: ^6.8.1
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_storage: ^14.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
