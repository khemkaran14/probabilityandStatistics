  in_app_purchase: ^3.3.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
